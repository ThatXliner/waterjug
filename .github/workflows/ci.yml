name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: |
          bun install
          bunx playwright install --with-deps
      - name: Start database
        run: |
          bunx supabase start
          bunx supabase db reset
      - name: Set environment variables
        run: |
          bunx supabase status -o env | node scripts/convert_env.js > .env
          test -s .env
      - run: bun run test
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Start database
        run: |
          bunx supabase start
          bunx supabase db reset
      - name: Set environment variables
        run: |
          bunx supabase status -o env | node scripts/convert_env.js > .env
          test -s .env
      - name: Lint code style
        run: bun run lint
      - name: Check types
        run: bun run check
  compare-remote-db:
    runs-on: ubuntu-latest
    env:
      # Setting an environment variable with the value of a configuration variable
      DB_URL: ${{ secrets.DB_URL }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Start database
        run: |
          bunx supabase db start
          bunx supabase db reset
      - name: Verify generated types match Postgres schema
        run: |
          bun run update-types
          if ! git diff --ignore-space-at-eol --exit-code --quiet src/lib/supabase.ts; then
              echo "Detected uncommitted changes after build. See status below:\n" >> $GITHUB_STEP_SUMMARY
              echo '```diff' >> $GITHUB_STEP_SUMMARY
              echo $(git diff) >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit 1
          fi
      - name: (main only) Ensure there are no unpushed migrations
        run: |
          if bunx supabase migration list --db-url $DB_URL | grep -E '\s*(\d+) │ \s+ │ .+$'; then
            echo "Unpushed migrations detected:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$(bunx supabase migration list --db-url $DB_URL | grep -E '\s*(\d+) │ \s+ │ .+$' --color=never)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
