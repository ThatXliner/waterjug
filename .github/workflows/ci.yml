name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

env:
  # Supabase local development's shared defaults; never use these as production credentials.
  PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
  SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
  RUN_DATABASE_TESTS: 'true'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npx --no-install playwright install --with-deps
      - name: Start database
        run: |
          npx --no-install supabase start
          npx --no-install supabase db reset
          npx --no-install supabase migration up --local
      - name: Verify database restrictions
        run: npm run test:db
      - run: npm run test
      - name: Test authorization privileges
        run: npm run test:database:authorization
      - name: Test Glicko database constraints
        run: npm run test:database:glicko
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint code style
        run: npm run lint
      - name: Check types
        run: npm run check
  compare-remote-db:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Setting an environment variable with the value of a configuration variable
      DB_URL: ${{ secrets.DB_URL }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start database
        run: |
          npx --no-install supabase db start
          npx --no-install supabase db reset
          npx --no-install supabase migration up --local
      - name: Verify generated types match Postgres schema
        run: |
          npx --no-install supabase gen types --lang typescript \
            --db-url postgresql://postgres:postgres@127.0.0.1:54322/postgres \
            > src/lib/supabase.ts
          node scripts/normalize_generated_file.js src/lib/supabase.ts
          if ! git diff --ignore-space-at-eol --exit-code --quiet src/lib/supabase.ts; then
              echo "Detected uncommitted changes after build. See status below:\n" >> $GITHUB_STEP_SUMMARY
              echo '```diff' >> $GITHUB_STEP_SUMMARY
              echo $(git diff) >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit 1
          fi
      - name: (main only) Ensure there are no unpushed migrations
        run: |
          if npx --no-install supabase migration list --db-url $DB_URL | grep -E '\s*(\d+) │ \s+ │ .+$'; then
            echo "Unpushed migrations detected:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$(npx --no-install supabase migration list --db-url $DB_URL | grep -E '\s*(\d+) │ \s+ │ .+$' --color=never)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
